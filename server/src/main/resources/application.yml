server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 8h
  forward-headers-strategy: framework

spring:
  application:
    name: xingchen-monitor
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${SMTP_HEALTH_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n"

app:
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  site-name: ${SITE_NAME:星辰监控}
  site-icon-storage-path: ${SITE_ICON_STORAGE_PATH:/var/lib/xingchen-monitor/site-icon}
  public-base-url: ${PUBLIC_BASE_URL:}
  allow-insecure-http: ${ALLOW_INSECURE_HTTP:false}
  settings-encryption-key: ${SETTINGS_ENCRYPTION_KEY:}
  metric-retention-days: ${METRIC_RETENTION_DAYS:30}
  device-offline-after-seconds: ${DEVICE_OFFLINE_AFTER_SECONDS:30}
  redis-enabled: ${REDIS_ENABLED:false}
  enable-mcp: ${ENABLE_MCP:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  realtime:
    enabled: ${REALTIME_V2_ENABLED:true}
    redis-channel: ${REALTIME_REDIS_CHANNEL:monitor:realtime:v1}
    outbox-batch-size: ${REALTIME_OUTBOX_BATCH_SIZE:100}
    replay-batch-size: ${REALTIME_REPLAY_BATCH_SIZE:200}
    retention-hours: ${REALTIME_RETENTION_HOURS:24}
    ticket-ttl-seconds: ${REALTIME_TICKET_TTL_SECONDS:30}
  push-kit:
    enabled: ${PUSH_KIT_ENABLED:false}
    project-id: ${PUSH_KIT_PROJECT_ID:}
    key-id: ${PUSH_KIT_KEY_ID:}
    sub-account: ${PUSH_KIT_SUB_ACCOUNT:}
    private-key: ${PUSH_KIT_PRIVATE_KEY:}
    category: ${PUSH_KIT_CATEGORY:MARKETING}
    ttl-seconds: ${PUSH_KIT_TTL_SECONDS:86400}
    batch-size: ${PUSH_KIT_BATCH_SIZE:50}
    max-attempts: ${PUSH_KIT_MAX_ATTEMPTS:5}
  controller-agent:
    enabled: ${CONTROLLER_AGENT_ENABLED:false}
    device-id: ${CONTROLLER_AGENT_DEVICE_ID:}
    key: ${CONTROLLER_AGENT_KEY:}
    name: ${CONTROLLER_AGENT_NAME:总控服务器}
    group-name: ${CONTROLLER_AGENT_GROUP:控制平面}
  controller-update:
    service-url: ${CONTROLLER_UPDATE_SERVICE_URL:http://setup:8090}
    token: ${CONTROLLER_UPDATE_TOKEN:}
  notification:
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
    smtp-auth: ${SMTP_AUTH:true}
    smtp-start-tls: ${SMTP_STARTTLS:true}
    email-from: ${ALERT_EMAIL_FROM:}
    email-to: ${ALERT_EMAIL_TO:}
    dingtalk-webhook-url: ${DINGTALK_WEBHOOK_URL:}
    dingtalk-keyword: ${DINGTALK_KEYWORD:}
    dingtalk-sign-secret: ${DINGTALK_SIGN_SECRET:}
    wecom-webhook-url: ${WECOM_WEBHOOK_URL:}
    generic-webhook-url: ${GENERIC_WEBHOOK_URL:}
    generic-webhook-format: ${GENERIC_WEBHOOK_FORMAT:GENERIC_JSON}

---
spring:
  config:
    activate:
      on-profile: bootstrap
  datasource:
    url: jdbc:h2:mem:bootstrap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
app:
  redis-enabled: false

---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    # Production always uses the PostgreSQL service created by Compose.
    # Do not fall back to the bootstrap H2 database when a deployment is incomplete.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
app:
  redis-enabled: true
  settings-encryption-key: ${SETTINGS_ENCRYPTION_KEY}
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
