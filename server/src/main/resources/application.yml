server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 8h
  forward-headers-strategy: framework

spring:
  application:
    name: guanlan-monitor
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${SMTP_HEALTH_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n"

app:
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  site-name: ${SITE_NAME:观澜监控}
  public-base-url: ${PUBLIC_BASE_URL:}
  allow-insecure-http: ${ALLOW_INSECURE_HTTP:false}
  settings-encryption-key: ${SETTINGS_ENCRYPTION_KEY:}
  metric-retention-days: ${METRIC_RETENTION_DAYS:30}
  device-offline-after-seconds: ${DEVICE_OFFLINE_AFTER_SECONDS:30}
  redis-enabled: ${REDIS_ENABLED:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
    smtp-auth: ${SMTP_AUTH:true}
    smtp-start-tls: ${SMTP_STARTTLS:true}
    email-from: ${ALERT_EMAIL_FROM:}
    email-to: ${ALERT_EMAIL_TO:}
    dingtalk-webhook-url: ${DINGTALK_WEBHOOK_URL:}
    wecom-webhook-url: ${WECOM_WEBHOOK_URL:}

---
spring:
  config:
    activate:
      on-profile: bootstrap
  datasource:
    url: jdbc:h2:mem:bootstrap;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
app:
  redis-enabled: false

---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    # Production must use the database explicitly entered in the setup guide.
    # Do not fall back to the bootstrap H2 database when a deployment is incomplete.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
app:
  redis-enabled: true
  settings-encryption-key: ${SETTINGS_ENCRYPTION_KEY}
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
