name: Verify existing v1.20.22 web and setup images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: xingchen-v1.20.22-verify-existing-images
  cancel-in-progress: false

env:
  SOURCE_REVISION: ccad45f04ab75656327ad69ccd2651e1d1ed84c1
  RELEASE_VERSION: v1.20.22

jobs:
  verify:
    if: github.repository == 'Pstarchen/monitor-for-server' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - component: web
            index: sha256:09f7c0db5d35d6a1b1135c75ae553851759368a7cf10435299486c080d973fab
          - component: setup
            index: sha256:082c6928e728804fdfd41044bf097f5d565a48c8ea730d6e9e7f4f024231e0e0
    env:
      COMPONENT: ${{ matrix.component }}
      EXPECTED_INDEX: ${{ matrix.index }}
      IMAGE_REPOSITORY: ghcr.io/pstarchen/monitor-for-server-${{ matrix.component }}
    steps:
      - name: Checkout exactly the tested source
        uses: actions/checkout@v4
        with:
          ref: ccad45f04ab75656327ad69ccd2651e1d1ed84c1
          persist-credentials: false

      - name: Verify source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]]

      - name: Authenticate for GHCR reads only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up manifest inspection
        uses: docker/setup-buildx-action@v3

      - name: Verify the pinned index and each platform's child manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_INDEX" =~ ^sha256:[a-f0-9]{64}$ ]]
          immutable_index="${IMAGE_REPOSITORY}@${EXPECTED_INDEX}"
          index_path="$RUNNER_TEMP/${COMPONENT}-index.json"
          docker buildx imagetools inspect "$immutable_index" --raw > "$index_path"
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${RELEASE_VERSION}" --raw > "$RUNNER_TEMP/${COMPONENT}-tag.json"
          cmp -- "$index_path" "$RUNNER_TEMP/${COMPONENT}-tag.json"
          jq -e '.schemaVersion == 2 and ([.manifests[]?.platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64")) | .architecture] | sort == ["amd64", "arm64"])' "$index_path" >/dev/null
          for architecture in amd64 arm64; do
            child_digest="$(jq -er --arg architecture "$architecture" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest' "$index_path")"
            [[ "$child_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            immutable_image="${IMAGE_REPOSITORY}@${child_digest}"
            docker pull --platform "linux/${architecture}" "$immutable_image"
            [[ "$(docker image inspect --format '{{.Os}}' "$immutable_image")" == linux ]]
            [[ "$(docker image inspect --format '{{.Architecture}}' "$immutable_image")" == "$architecture" ]]
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$immutable_image")" == "$RELEASE_VERSION" ]]
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$immutable_image")" == "$SOURCE_REVISION" ]]
            if [[ "$COMPONENT" == setup ]]; then
              docker run --rm --platform "linux/${architecture}" --network none --read-only \
                --entrypoint sh "$immutable_image" -ec '
                  cd /usr/local/share/xingchen/release
                  sha256sum -c manifest.json.sha256
                  grep -Eq '"'"'"version"[[:space:]]*:[[:space:]]*"v1.20.22"'"'"' manifest.json
                  cd assets
                  sha256sum -c checksums.txt
                  test "$(find . -maxdepth 1 -type f -name "xingchen-agent_*" | wc -l)" -eq 4
                  for asset in xingchen-agent_1.20.22_linux_amd64.tar.gz xingchen-agent_1.20.22_linux_arm64.tar.gz xingchen-agent_1.20.22_windows_amd64.zip xingchen-agent_1.20.22_windows_arm64.zip; do test -s "$asset"; done
                  cd /usr/local/share/xingchen/controller-update
                  test "$(cat version)" = v1.20.22
                  sha256sum -c SHA256SUMS
                  test -s /usr/local/share/xingchen/installers/install-agent.sh
                  test -s /usr/local/share/xingchen/installers/install-agent.ps1
                '
            fi
            printf 'VERIFIED_PLATFORM_IMAGE=linux/%s %s\n' "$architecture" "$immutable_image"
          done
          printf 'VERIFIED_EXISTING_GHCR_IMAGE=%s\n' "$immutable_index"
