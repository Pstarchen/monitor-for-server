name: Build and publish Agent image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Linux installer
        run: sudo bash deploy/install-agent_test.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test Agent
        working-directory: agent
        run: go test ./...

      - name: Verify runtime image
        run: |
          docker build --tag xingchen-agent-test ./agent
          docker run --rm --entrypoint /bin/sh xingchen-agent-test -ec 'test -x /xingchen-agent && command -v chroot'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}-agent" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage
          build() {
            local os="$1" arch="$2" format="$3" binary="dist/stage/xingchen-agent"
            local archive="dist/xingchen-agent_${version}_${os}_${arch}.${format}"
            rm -rf dist/stage/*
            (cd agent && CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "../${binary}" ./cmd/agent)
            if [[ "${format}" == tar.gz ]]; then
              tar -C dist/stage -czf "${archive}" xingchen-agent
            else
              mv "${binary}" dist/stage/xingchen-agent.exe
              (cd dist/stage && zip -q "../../${archive}" xingchen-agent.exe)
            fi
          }
          build linux amd64 tar.gz
          build linux arm64 tar.gz
          build windows amd64 zip
          build windows arm64 zip
          (cd dist && sha256sum xingchen-agent_* > checksums.txt)

      - name: Generate release manifest
        working-directory: setup
        run: |
          go run ./cmd/release-manifest -version "${GITHUB_REF_NAME}" -assets ../dist -output ../dist/manifest.json -minimum-controller v1.20.0
          (cd ../dist && sha256sum manifest.json > manifest.json.sha256)

      - name: Publish Agent Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --generate-notes --title "星辰监控 ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/xingchen-agent_* dist/checksums.txt dist/manifest.json dist/manifest.json.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
