name: guanlan-monitor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guanlan_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-guanlan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [monitor]

  setup:
    image: ${XINGCHEN_SETUP_IMAGE:-${GUANLAN_SETUP_IMAGE:-ghcr.io/pstarchen/monitor-for-server-setup:latest}}
    build:
      context: ./setup
    restart: unless-stopped
    environment:
      SETUP_WORKSPACE: /workspace
      POSTGRES_DB: ${POSTGRES_DB:-guanlan_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-guanlan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      WEB_PORT: ${WEB_PORT:-18080}
      WEB_BIND_ADDRESS: ${WEB_BIND_ADDRESS:-0.0.0.0}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-guanlan-monitor}
      CONTROLLER_AGENT_ENABLED: ${CONTROLLER_AGENT_ENABLED:-false}
      CONTROLLER_AGENT_DEVICE_ID: ${CONTROLLER_AGENT_DEVICE_ID:-}
      CONTROLLER_AGENT_KEY: ${CONTROLLER_AGENT_KEY:-}
      CONTROLLER_AGENT_NAME: ${CONTROLLER_AGENT_NAME:-总控服务器}
      CONTROLLER_AGENT_GROUP: ${CONTROLLER_AGENT_GROUP:-控制平面}
      CONTROLLER_UPDATE_TOKEN: ${SETTINGS_ENCRYPTION_KEY-}
      CONTROLLER_BACKUP_AUTO: ${CONTROLLER_BACKUP_AUTO:-false}
      CONTROLLER_BACKUP_RETENTION: ${CONTROLLER_BACKUP_RETENTION:-7}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/setup/status"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [monitor]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [monitor]

  server:
    image: ${XINGCHEN_SERVER_IMAGE:-${GUANLAN_SERVER_IMAGE:-ghcr.io/pstarchen/monitor-for-server-server:latest}}
    build:
      context: ./server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-bootstrap}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-guanlan_monitor}
      DB_USERNAME: ${POSTGRES_USER:-guanlan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_MCP: ${ENABLE_MCP:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      SITE_NAME: ${SITE_NAME:-星辰监控}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18080}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
      DEVICE_OFFLINE_AFTER_SECONDS: ${DEVICE_OFFLINE_AFTER_SECONDS:-30}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:18080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      GENERIC_WEBHOOK_URL: ${GENERIC_WEBHOOK_URL:-}
      GENERIC_WEBHOOK_FORMAT: ${GENERIC_WEBHOOK_FORMAT:-GENERIC_JSON}
      REALTIME_REDIS_CHANNEL: ${REALTIME_REDIS_CHANNEL:-monitor:realtime:v1}
      REALTIME_OUTBOX_BATCH_SIZE: ${REALTIME_OUTBOX_BATCH_SIZE:-100}
      REALTIME_REPLAY_BATCH_SIZE: ${REALTIME_REPLAY_BATCH_SIZE:-200}
      REALTIME_RETENTION_HOURS: ${REALTIME_RETENTION_HOURS:-24}
      REALTIME_TICKET_TTL_SECONDS: ${REALTIME_TICKET_TTL_SECONDS:-30}
      PUSH_KIT_ENABLED: ${PUSH_KIT_ENABLED:-false}
      PUSH_KIT_PROJECT_ID: ${PUSH_KIT_PROJECT_ID:-}
      PUSH_KIT_KEY_ID: ${PUSH_KIT_KEY_ID:-}
      PUSH_KIT_SUB_ACCOUNT: ${PUSH_KIT_SUB_ACCOUNT:-}
      PUSH_KIT_PRIVATE_KEY: ${PUSH_KIT_PRIVATE_KEY:-}
      PUSH_KIT_CATEGORY: ${PUSH_KIT_CATEGORY:-MARKETING}
      PUSH_KIT_TTL_SECONDS: ${PUSH_KIT_TTL_SECONDS:-86400}
      PUSH_KIT_BATCH_SIZE: ${PUSH_KIT_BATCH_SIZE:-50}
      PUSH_KIT_MAX_ATTEMPTS: ${PUSH_KIT_MAX_ATTEMPTS:-5}
      CONTROLLER_AGENT_ENABLED: ${CONTROLLER_AGENT_ENABLED:-false}
      CONTROLLER_AGENT_DEVICE_ID: ${CONTROLLER_AGENT_DEVICE_ID:-}
      CONTROLLER_AGENT_KEY: ${CONTROLLER_AGENT_KEY:-}
      CONTROLLER_AGENT_NAME: ${CONTROLLER_AGENT_NAME:-总控服务器}
      CONTROLLER_AGENT_GROUP: ${CONTROLLER_AGENT_GROUP:-控制平面}
      CONTROLLER_UPDATE_SERVICE_URL: http://setup:8090
      CONTROLLER_UPDATE_TOKEN: ${SETTINGS_ENCRYPTION_KEY-}
      SITE_ICON_STORAGE_PATH: /var/lib/guanlan-monitor/site-icon
    volumes:
      - site-icon-data:/var/lib/guanlan-monitor/site-icon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [monitor]

  controller-agent:
    profiles: [host-monitoring]
    image: ${XINGCHEN_AGENT_IMAGE:-${GUANLAN_AGENT_IMAGE:-ghcr.io/pstarchen/monitor-for-server-agent:latest}}
    build:
      context: ./agent
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      CONTROLLER_AGENT_DEVICE_ID: ${CONTROLLER_AGENT_DEVICE_ID:-}
      CONTROLLER_AGENT_KEY: ${CONTROLLER_AGENT_KEY:-}
      CONTROLLER_AGENT_SERVER_URL: http://127.0.0.1:${WEB_PORT:-18080}
    volumes:
      - /:/host:ro
      - /dev:/host/dev:ro
      - controller-agent-spool:/var/lib/guanlan-agent/spool
    tmpfs:
      - /run
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        cat > /run/agent.json <<EOF
        {"server_url":"$${CONTROLLER_AGENT_SERVER_URL}","device_id":"$${CONTROLLER_AGENT_DEVICE_ID}","agent_key":"$${CONTROLLER_AGENT_KEY}","interval":"3s","request_timeout":"10s","spool_dir":"/var/lib/guanlan-agent/spool","max_buffered_reports":10000,"allow_insecure_http":false,"skip_process_collection":false,"skip_connection_count":false,"disk_mountpoints":[],"host_root":"/host"}
        EOF
        exec /guanlan-agent -config /run/agent.json
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/agent.json && kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 4

  web:
    image: ${XINGCHEN_WEB_IMAGE:-${GUANLAN_WEB_IMAGE:-ghcr.io/pstarchen/monitor-for-server-web:latest}}
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-18080}:80"
    depends_on:
      setup:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [monitor]

volumes:
  postgres-data:
  redis-data:
  site-icon-data:
  controller-agent-spool:

networks:
  monitor:
    driver: bridge
